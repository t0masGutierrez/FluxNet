# Runtime configuration used by the poster ICON checkpoints.
model:
  pe: learned
  data_mask: false
  tran: custom
  ff: true
  transformer:
    n_layers: 6
    n_heads: 8
    model_dim: 192
    widening_factor: 4
loss:
  shot_num_min: 1
training:
  total_steps: 1000000
  save_interval: 10000
  track: track_a
  optimizer:
    peak_lr: 0.0001
    weight_decay: 0.0001
    gnorm_clip: 1.0
    warmup_percent: 0.5
    decay_percent: 100.0
  accuracy: conserve
inference:
  context_length: 20
  horizon: 20
  dt: 0.005
  dx: 0.01
