[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxnet"
version = "0.1.0"
description = "A conservative FluxNet inference model for one-dimensional state rollouts"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "h5py>=3.13.0",
    "numpy>=2.1.0",
    "torch>=2.6.0",
]

[project.optional-dependencies]
comparison = [
    "hydra-core>=1.3.0",
    "matplotlib>=3.8.0",
    "pillow>=10.0.0",
    "pytz>=2024.1",
    "wandb>=0.19.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "chebyshev",
    "coefficients",
    "flux_inference",
    "fluxnet",
    "prompt",
    "validation",
]

[tool.ruff]
target-version = "py311"
line-length = 120
indent-width = 4

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = [
    "chebyshev",
    "coefficients",
    "flux_inference",
    "fluxnet",
    "prompt",
    "validation",
]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
